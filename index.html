<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>Tekko 2026 Schedule, Map &amp; Planner — Unofficial Companion</title>
    <meta
      name="description"
      content="A fast, mobile-friendly schedule for Tekko 2026 (July 23–26, Pittsburgh). Browse all 943 events, filter by category, find rooms on the map, and build your own schedule. Works offline."
    />
    <meta
      name="keywords"
      content="Tekko 2026, Tekko schedule, Tekkoshocon, anime convention Pittsburgh, Tekko map, Tekko guests, Tekko events, David L. Lawrence Convention Center anime"
    />
    <meta name="author" content="Unofficial fan project" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph (canonical URL + absolute image finalized at deploy) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tekko 2026 Companion" />
    <meta property="og:title" content="Tekko 2026 Schedule, Map &amp; Planner" />
    <meta
      property="og:description"
      content="Browse all 943 Tekko 2026 events, filter by category, find rooms on the map, and build your own schedule. Works offline."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tekko 2026 — Schedule, Map, Guests" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tekko 2026 Schedule, Map &amp; Planner" />
    <meta
      name="twitter:description"
      content="All 943 Tekko 2026 events, filterable, with a room map and a personal planner. Works offline."
    />
    <meta name="twitter:image" content="/og.png" />

    <meta name="theme-color" content="#0F1621" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tekko 26" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- Structured data: helps Google show this as the Tekko 2026 event -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Tekko 2026",
        "description": "Pennsylvania's largest anime convention — Japanese pop culture, J-fashion, gaming, panels, and more.",
        "startDate": "2026-07-23",
        "endDate": "2026-07-26",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "location": {
          "@type": "Place",
          "name": "David L. Lawrence Convention Center",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1000 Fort Duquesne Blvd",
            "addressLocality": "Pittsburgh",
            "addressRegion": "PA",
            "postalCode": "15222",
            "addressCountry": "US"
          }
        },
        "organizer": {
          "@type": "Organization",
          "name": "Pittsburgh Japanese Culture Society (PittJCS)",
          "url": "https://tekko.co/"
        }
      }
    </script>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var t = JSON.parse(localStorage.getItem('tekko.v1.prefs') || '{}').theme;
        if (t && t !== 'system') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
